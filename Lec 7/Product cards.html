<!DOCTYPE html>
<head>
    <title>Product Cards</title>

    <style>

        body{
            margin:0;
            padding:20px;
            font-family: Arial,sans-serif;
        }

        h1{
            text-align: center;
            font-weight: bold;
            
        }

        .Products{
            display:flex;
            flex-wrap: wrap;
            gap:20px;
            justify-content: center;

        }

        .card{
            width:250px;
            border:1px solid lightgrey;
            border-radius:10px;
            padding:15px;
            text-align: center;
            box-shadow:0.2px 5px antiquewhite;
            transition: 0.3s;
        }

        .card img{
            width:100%;
            height:200px;
            object-fit: cover;
            border-radius: 10px;;
        }

        .card h3{
            margin:10px 0;
        }

        .card p{
              font-size:18px;
            font-weight:bold;
        }

        .card button{
            padding:10px 20px;
            background-color:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .card button:hover{
            background-color:darkblue;

        }
        
    </style>
</head>

<body>
    <h1>Our Products</h1>
    <div class="Products">

        <div class="card">
            <img src="product1.jpg" alt="Product 1">

            <h3>Smart Watch</h3>
            <p>₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product2.jpg" alt="Product 2">

            <h3>Headphones</h3>
            <p>₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product3.jpg" alt="Product 3">

            <h3>Bluetooth Speaker</h3>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product4.jpg" alt="Product 4">

            <h3>Wireless Mouse</h3>
            <p>₹499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product5.jpg" alt="Product 5">

            <h3>Keyboard</h3>
            <p>₹899</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="product6.jpg" alt="Product 6">

            <h3>Power bank</h3>
            <p>₹1,299</p>
            <button>Buy Now</button>
        </div>

    </div>


</body>
</html>
