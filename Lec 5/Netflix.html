<!DOCTYPE html>
<head>
    <title>Netflix Landing Page Clone</title>

    <style>
        body{
            background-image: url("Netflixbg.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin:0;
            padding: 200px;
            align-items: center;
            

            color:white;
            text-align: center;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container{
            padding-top: 200px;
        }

        h1{
            font-size: 75px;
            font-weight: bold;
            margin:0;

        }

       .para1{
        font-size: 24px;
        font-family: Georgia, serif;
       }

       .para2{
        font-size: 20px;
        font-family: Verdana, sans-serif;
        margin:0;
       }

       input[type="email"]{
        width: 300px;
        padding:15px;
        font-size: 16px;
        border:grey;
        border-radius:7px;
       }

       button{
        background-color: red;
        color:white;
        font-size: 18px;
        border:none;
        border-radius: 5px;
        padding: 15px 25px;
       }

       button:hover{
        background-color: darkred;
        color: white;
        transform: scale(1.05);
       }
        
    </style>

</head>

<body>

    <div class="container">
        <h1>Unlimited Movies, <br>
            TV Shows and More</h1>

        <p class="para1">
            Watch anywhere.  Cancel anytime.
        </p>

        <p class="para2">
            Ready to watch? Enter your email to create or restart your membership.
        </p>
        <br>

        <input type="email" placeholder="Email Address" required>

        <button>Get Started  > </button>
    </div>
</body>
</html>
