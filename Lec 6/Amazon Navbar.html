<!DOCTYPE html>
<head>
    <title>Amazon Navbar</title>

    <style>

        h2{
            font-size: 45px;
            gap:30px;
        }
        

        body{
            margin: 0;
            font-family:Georgia, 'Times New Roman', Times, serif;
        }

        nav{
            background-color: black;
            color:white;
            padding:10px;
            display: flex;
            gap:20px;
            align-items: center;
        }

        input{
            padding-right: 25px;
            text-align: center;
            align-items: center;
            font-size: 30px;
        }

        button{
            
           padding:12px 25px;
           font-size: 16px;
           background-color: white;
           border:none;
           border-radius:5px;
           cursor:pointer
        }

        .right{
            margin:auto;
            display: flex;
            gap:15px;
        }

        </style>

</head>
<body>
    <nav>
        <h2>Amazon</h2>
        <input type="text" placeholder="Search Amazon">

        <div class="right">
        <button>Sign In</button>
        <button>Cart</button>
        </div>
    </nav>

</body>
</html>
